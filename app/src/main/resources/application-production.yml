# Production-only safeguards. Local development continues to use application.yml unchanged.
spring:
  config:
    activate:
      on-profile: production
  task:
    scheduling:
      pool:
        # 默认单线程：Dify 删除重试可能连续做多次 HTTP（含退避），会把简历回收器等任务堵在后面
        size: 4
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "${REDIS_ADDRESS}"
          database: ${REDIS_DATABASE:0}
          # 刻意保持 Redisson 默认的超时与重试（timeout=3000、retryAttempts=4）。
          # 这些参数同时管辖连接池建立与握手：调小后在跨机房的丢包链路上会出现
          # "Unable to init enough connections amount"，应用直接起不来。
          # Redis 故障对接口的影响改由 RateLimitAspect 的失败放行兜住。
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          # 让 AI_MODEL 真的生效：此前 compose 传了它，但没有任何配置读它，
          # 改这个变量不换模型（一直是基础配置里的 qwen-plus），排障时容易被误导。
          # 不设该变量时取 qwen-plus，与现状一致。
          model: ${AI_MODEL:qwen-plus}

async:
  task:
    max-concurrency: ${ASYNC_TASK_MAX_CONCURRENCY:8}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  ai:
    limiter:
      provider-max-concurrency: ${AI_PROVIDER_MAX_CONCURRENCY:8}
      user-max-concurrency: ${AI_USER_MAX_CONCURRENCY:4}
      acquire-timeout: ${AI_ACQUIRE_TIMEOUT:10s}
  jwt:
    secret: ${APP_JWT_SECRET}
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT}
    access-key: ${APP_STORAGE_ACCESS_KEY}
    secret-key: ${APP_STORAGE_SECRET_KEY}
    bucket: ${APP_STORAGE_BUCKET}
    region: ${APP_STORAGE_REGION:us-east-1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    environment: production
